name: Bug report
description: Report reproducible incorrect behavior or an unexpected refusal.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include private translations, credentials, or customer data.
  - type: input
    id: version
    attributes:
      label: BundleSafe version
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: IDE and build
      description: Copy the product name and exact build number from Help | About.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use invented values and the smallest safe example possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and exact error
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data check
      options:
        - label: I removed credentials, customer data, and proprietary translations.
          required: true

